<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Coffee. | Coffee Beans with a Perfect Aroma</title>
    <meta name="description" content="Coffee shop serving classic and modern coffee, arabica drinks and cocktails." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <style>
      :root {
        --ink: #14213D;
        --ink-2: #1F2F55;
        --tomato: #E8462B;
        --tomato-deep: #C92A14;
        --butter: #FFC93C;
        --cream: #FFF6EA;
        --mint: #CDEBD9;
        --white: #FFFFFF;
        --font-display: 'Unbounded', system-ui, sans-serif;
        --font-body: 'Inter', system-ui, sans-serif;
      }
      html { overflow-x: clip; }
      body { margin: 0; overflow-x: clip; background: var(--cream); color: var(--ink);
        font-family: var(--font-body); line-height: 1.6; -webkit-font-smoothing: antialiased; }
      img { max-width: 100%; height: auto; }
      a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--butter); outline-offset: 3px; }
      .container { padding-left: 16px; padding-right: 16px; }
      @media (min-width: 576px) { .container { padding-left: 24px; padding-right: 24px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
